# Common Configuration
server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  tomcat:
    remote-ip-header: x-forwarded-for
    protocol-header: x-forwarded-proto
  error:
    include-message: always
    include-binding-errors: always

# Application Configuration
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# Static resources
spring:
  # PostgreSQL Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skgchess}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 600000
      connection-timeout: 60000
      max-lifetime: 900000
      validation-timeout: 10000
      connection-test-query: SELECT 1
      auto-commit: false
      pool-name: skgchess-pool
      leak-detection-threshold: 60000

  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
  mvc:
    static-path-pattern: /**
  
  # Debug
  devtools:
    add-properties: true

  # JPA/Hibernate Properties
  jpa:
    hibernate:
      ddl-auto: update
    # Disabled show-sql for production
    show-sql: false
    properties:
      hibernate:
        # Disabled format_sql for production
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Reduced batch size for free tier
        jdbc:
          batch_size: 20
          batch_versioned_data: true
        # Disabled statistics for better performance
        generate_statistics: false
        # Added these settings for better performance
        connection:
          provider_disables_autocommit: false
        # Cache settings for better performance
        cache:
          use_second_level_cache: false
          use_query_cache: false
        # Database creation and schema settings
        hbm2ddl:
          auto: update
        # Schema settings
        default_schema: public
        default_catalog: skgchess

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# Logging
logging:
  file:
    name: logs/chess-application.log
    max-size: 10MB
    max-history: 7
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com:
      chess: DEBUG
    org:
      springframework:
        web: DEBUG
        web.servlet.resource: TRACE
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
    web: DEBUG
    root: INFO
    com.chess.security: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG


    
//Static Resources Definition: Static resources are files that are served directly to the client without any server-side processing. They do not change based on user input or application state.

//View Templates Definition: View templates are files that define the structure and layout of the web pages that are rendered dynamically by the server. They often contain placeholders for data that will be filled in at runtime.