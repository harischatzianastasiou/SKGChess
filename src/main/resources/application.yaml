# Common Configuration
server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  tomcat:
    remote-ip-header: x-forwarded-for
    protocol-header: x-forwarded-proto
  error:
    include-message: always
    include-binding-errors: always

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# Static resources
spring:
  # PostgreSQL Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skgchess}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      validation-timeout: 5000
      connection-test-query: SELECT 1
      auto-commit: true

  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
  mvc:
    static-path-pattern: /**
  
  # Debug
  devtools:
    add-properties: true

  # JPA/Hibernate Properties
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Database creation and schema settings
        hbm2ddl:
          auto: update
        # Connection settings
        connection:
          provider_disables_autocommit: true
        # JDBC settings
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        # Performance settings
        order_inserts: true
        order_updates: true
        generate_statistics: true
        # Schema settings
        default_schema: public
        default_catalog: skgchess

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# Logging
logging:
  file:
    name: logs/chess-application.log
    max-size: 10MB
    max-history: 7
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com:
      chess: DEBUG
    org:
      springframework:
        web: DEBUG
        web.servlet.resource: TRACE
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
    web: DEBUG
    root: INFO
    com.chess.security: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG


    
//Static Resources Definition: Static resources are files that are served directly to the client without any server-side processing. They do not change based on user input or application state.

//View Templates Definition: View templates are files that define the structure and layout of the web pages that are rendered dynamically by the server. They often contain placeholders for data that will be filled in at runtime.