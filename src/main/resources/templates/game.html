<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Chess Game - SKG Chess</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font imports for consistent styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/board-purple.css" id="board-theme">
    <link rel="stylesheet" href="/css/theme-switcher.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/images/skgchessicon.png">
    <!-- WebSocket libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <!-- Chess.js for game logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- Custom JavaScript -->
    <script th:inline="javascript" src="/js/game.js" defer></script>
</head>
<body>
    <div class="game-layout">
        <!-- Header with logo and user info -->
        <header class="header">
            <a href="/" class="logo-container">
                <img src="/images/skgchess.svg" alt="SKG Chess Logo" class="logo-img">
            </a>
            <div class="header-right">
                <div sec:authorize="isAuthenticated()">
                    <span sec:authentication="name" id="username" style="display: none;"></span>
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-sign-in">Sign Out</button>
                    </form>
                </div>
                <div sec:authorize="!isAuthenticated()">
                    <a href="/login" class="btn btn-sign-in">Sign In</a>
                </div>
            </div>
        </header>

        <!-- Main game area -->
        <div class="game-container">
            <!-- Left panel with player info and controls -->
            <div class="left-panel">
                <!-- Theme Switcher -->
                <div class="theme-switcher-container">
                    <div class="theme-switcher purple-theme active" data-theme="purple"></div>
                    <div class="theme-switcher gold-theme" data-theme="gold"></div>
                </div>
                
                <!-- Current player info -->
                <div class="player-card">
                    <div class="player-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="player-details">
                        <h3 id="current-player-name" th:text="${username}">Current Player</h3>
                        <div class="player-color-indicator" th:classappend="${userId == whitePlayerId ? 'white-player' : 'black-player'}"></div>
                    </div>
                    <div class="player-timer">10:00</div>
                </div>

                <!-- Game controls -->
                <div class="game-controls">
                    <button id="resign-btn" class="btn btn-danger"><i class="fas fa-flag"></i> Resign</button>
                    <button id="draw-btn" class="btn btn-warning"><i class="fas fa-handshake"></i> Offer Draw</button>
                    <button id="new-game-btn" class="btn btn-primary"><i class="fas fa-plus"></i> New Game</button>
                    <div id="status">White to move</div>
                </div>

                <!-- Move history -->
                <div class="move-history">
                    <h3>Move History</h3>
                    <div id="moves-list" class="moves-list"></div>
                </div>
            </div>

            <!-- Center panel with chess board -->
            <div class="center-panel">
                <div class="board-wrapper">
                    <!-- Game Start Animation Overlay -->
                    <div id="game-start-overlay" class="game-start-overlay">
                        <div class="game-start-content">
                            <div class="game-start-text">GAME START</div>
                            <div class="game-start-sparkles"></div>
                        </div>
                    </div>
                    
                    <div id="game-board" class="chess-board"></div>
                </div>
            </div>

            <!-- Right panel with opponent and chat -->
            <div class="right-panel">
                <!-- Opponent info -->
                <div class="player-card">
                    <div class="player-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="player-details">
                        <h3 id="opponent-player-name" th:text="${userId == whitePlayerId ? blackPlayerUsername : whitePlayerUsername}">Opponent</h3>
                        <div class="player-color-indicator" th:classappend="${userId == whitePlayerId ? 'black-player' : 'white-player'}"></div>
                    </div>
                    <div class="player-timer">10:00</div>
                </div>

                <!-- Game chat -->
                <div class="game-chat">
                    <h3>Game Chat</h3>
                    <div id="chat-messages" class="chat-messages"></div>
                    <div class="chat-input">
                        <input type="text" id="chat-input" placeholder="Type a message...">
                        <button id="send-message" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>

                <!-- Footer with author info -->
                <div class="game-footer">
                    <p class="author-info">
                        Created by
                        <a href="https://github.com/harischatzianastasiou" target="_blank">
                            <i class="fab fa-github"></i> @harischatzianastasiou
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Theme Switcher Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get all theme switcher elements
            const themeSwitchers = document.querySelectorAll('.theme-switcher');
            const boardThemeLink = document.getElementById('board-theme');
            
            // Function to switch theme
            function switchTheme(theme) {
                // Remove active class from all theme switchers
                themeSwitchers.forEach(switcher => {
                    switcher.classList.remove('active');
                });
                
                // Add active class to selected theme switcher
                const selectedSwitcher = document.querySelector(`.theme-switcher[data-theme="${theme}"]`);
                if (selectedSwitcher) {
                    selectedSwitcher.classList.add('active');
                }
                
                // Change the CSS file based on theme
                if (theme === 'purple') {
                    boardThemeLink.href = '/css/board-purple.css';
                } else if (theme === 'gold') {
                    boardThemeLink.href = '/css/board-gold.css';
                }
                
                // Save theme preference to localStorage
                localStorage.setItem('chess-board-theme', theme);
            }
            
            // Add click event listeners to theme switchers
            themeSwitchers.forEach(switcher => {
                switcher.addEventListener('click', function() {
                    const theme = this.getAttribute('data-theme');
                    switchTheme(theme);
                });
            });
            
            // Load saved theme preference if exists
            const savedTheme = localStorage.getItem('chess-board-theme');
            if (savedTheme) {
                switchTheme(savedTheme);
            }
        });
    </script>
</body>
</html>
