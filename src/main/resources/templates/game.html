<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title id="gametitlelang"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font imports for consistent styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"> -->
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/game.css">
    <link rel="stylesheet" href="/css/board-purple.css" id="board-theme">
    <link rel="stylesheet" href="/css/theme-switcher.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/toskaki.png">
    <link rel="preload" href="/images/background1.png" as="image">
    <!-- <link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">    WebSocket libraries -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet"> Caveat font for body -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <!-- Custom JavaScript -->
    <script th:inline="javascript" src="/js/game.js" defer></script>
    <script src="/js/language.js"></script>
</head>
<body>
    <header class="header">
        <a href="/" class="logo" style="text-decoration: none; color: #fff;">skgchess</a>
        <div sec:authorize="isAuthenticated()">
            <span sec:authentication="name" id="username" style="display: none;"></span>
        </div>
        <div sec:authorize="!isAuthenticated()">
            <a href="/login" class="btn btn-sign-in" id="gamesigninlang">Sign In</a>
        </div>
    </header>

    <div class="game-layout">
        <div class="game-container">
            <!-- Main game area -->
            <div class="game-main">
                <div class="player-row player-row-top">
                    <div class="opponent-info">
                        <div class="player-card">
                            <div class="player-details">
                                <div class="player-color-indicator" th:classappend="${userId == whitePlayerId ? 'black-player' : 'white-player'}"></div>
                                <h3 id="opponent-player-name" th:text="${userId == whitePlayerId ? blackPlayerUsername : whitePlayerUsername}">Opponent</h3>
                            </div>
                            <div class="player-timer"></div>
                        </div>
                    </div>
                </div>
                <div class="board-row">
                    <div class="board-wrapper">
                        <div id="game-board" class="chess-board"></div>
                    </div>
                </div>
                <div class="player-row player-row-bottom">
                    <div class="current-player-info">
                        <div class="player-card">
                            <div class="player-details">
                                <div class="player-color-indicator" th:classappend="${userId == whitePlayerId ? 'white-player' : 'black-player'}"></div>
                                <h3 id="current-player-name" th:text="${username}">Current Player</h3>
                            </div>
                            <div class="player-timer"></div>
                            <!-- Navigation buttons for game position browsing -->
                            <div class="position-navigation">
                                <button id="initial-position-btn" class="nav-btn nav-btn-initial" title="Initial Position">
                                    &lt;&lt;
                                </button>
                                <button id="prev-position-btn" class="nav-btn nav-btn-left" title="Previous Position">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <button id="next-position-btn" class="nav-btn nav-btn-right" title="Next Position">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                                <button id="latest-position-btn" class="nav-btn nav-btn-latest" title="Latest Position">
                                    &gt;&gt;
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Game sidebar -->
            <div class="game-sidebar">
                <!-- Tab bar for Play -->
                <div class="sidebar-tabs">
                    <button class="sidebar-tab active" data-tab="play" id="gameplaytablang"></button>
                </div>
                
                <!-- Tab panels -->
                <div class="sidebar-tab-panels">
                    <div class="play-tab sidebar-tab-panel active">
                        <!-- Move History Section -->
                        <div class="move-history-section">
                            <h3 id="gamemovehistorylang"></h3>
                            <div id="moves-list" class="moves-list"></div>
                        </div>
                        
                        <!-- Game Controls Section -->
                        <div class="game-controls-section">
                            <div class="game-controls">
                                <!-- Theme Switcher Dropdown (button and popup) -->
                                <div class="theme-switcher-dropdown">
                                    <button id="theme-switcher-btn" class="btn btn-theme" title="Switch Theme"><i class="fas fa-palette"></i></button>
                                    <div id="theme-switcher-popup" class="theme-switcher-popup" style="display: none;">
                                        <div class="theme-switcher purple-theme" data-theme="purple" title="Purple"></div>
                                        <div class="theme-switcher gold-theme" data-theme="gold" title="Gold"></div>
                                        <div class="theme-switcher brown-theme" data-theme="brown" title="Brown"></div>
                                    </div>
                                </div>
                                <button id="resign-btn" class="btn btn-danger" title="Resign"><i class="fas fa-flag"></i></button>
                                <button id="draw-btn" class="btn btn-warning" title="Offer Draw"><i class="fas fa-handshake"></i></button>
                            </div>
                            <div id="status" class="game-status">White to move</div>
                        </div>
                        
                        <!-- Game Chat Section -->
                        <div class="game-chat-section">
                            <h3 id="gamechatlang"></h3>
                            <div id="chat-messages" class="chat-messages"></div>
                            <div class="chatinput">
                                <input type="text" id="chatinput" placeholder="">
                                <button id="send-message" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
                            </div>
                        </div>
                        
                        <!-- Enlarged Chat Modal -->
                        <div id="chatModal" class="chat-modal">
                            <div class="chat-modal-content">
                                <div class="chat-modal-header">
                                    <h3 id="gamechatmodallang"></h3>
                                    <button class="chat-modal-close" id="chatModalClose">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                                <div class="chat-modal-body">
                                    <div id="chat-modal-messages" class="chat-modal-messages"></div>
                                    <div class="chatmodalinput">
                                        <input type="text" id="chatmodalinput" placeholder="">
                                        <button id="chat-modal-send" title="Send message">
                                            <i class="fas fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Audio Player -->
        <div th:replace="fragments/audio-player :: audio-player"></div>
        
        <!-- Theme Switcher Script -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const themeSwitchers = document.querySelectorAll('.theme-switcher');
                const boardThemeLink = document.getElementById('board-theme');
                
                function switchTheme(theme) {
                    themeSwitchers.forEach(switcher => {
                        switcher.classList.remove('active');
                    });
                    
                    const selectedSwitcher = document.querySelector(`.theme-switcher[data-theme="${theme}"]`);
                    if (selectedSwitcher) {
                        selectedSwitcher.classList.add('active');
                    }
                    
                    if (theme === 'purple') {
                        boardThemeLink.href = '/css/board-purple.css';
                    } else if (theme === 'gold') {
                        boardThemeLink.href = '/css/board-gold.css';
                    } else if (theme === 'brown') {
                        boardThemeLink.href = '/css/board-brown.css';
                    }
                    
                    localStorage.setItem('chess-board-theme', theme);
                }
                
                themeSwitchers.forEach(switcher => {
                    switcher.addEventListener('click', function() {
                        const theme = this.getAttribute('data-theme');
                        switchTheme(theme);
                    });
                });
                
                const savedTheme = localStorage.getItem('chess-board-theme');
                if (savedTheme) {
                    switchTheme(savedTheme);
                }
            });
        </script>

        <!-- Tab switching logic for sidebar -->
        <script>
        // Simple and easy to learn!
        document.addEventListener('DOMContentLoaded', function() {
            const tabButtons = document.querySelectorAll('.sidebar-tab');
            const tabPanels = document.querySelectorAll('.sidebar-tab-panel');
            tabButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Remove active from all
                    tabButtons.forEach(b => b.classList.remove('active'));
                    tabPanels.forEach(p => p.classList.remove('active'));
                    // Add active to clicked and corresponding panel
                    btn.classList.add('active');
                    document.querySelector('.' + btn.dataset.tab + '.sidebar-tab-panel').classList.add('active');
                });
            });
        });
        </script>

        <!-- Theme switcher popup logic -->
        <script>
        // Simple and easy to learn!
        document.addEventListener('DOMContentLoaded', function() {
            const themeBtn = document.getElementById('theme-switcher-btn');
            const popup = document.getElementById('theme-switcher-popup');
            // Toggle popup on button click
            themeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                popup.style.display = (popup.style.display === 'none' || popup.style.display === '') ? 'flex' : 'none';
            });
            // Hide popup when clicking outside
            document.addEventListener('click', function(e) {
                if (!popup.contains(e.target) && e.target !== themeBtn) {
                    popup.style.display = 'none';
                }
            });
            // Theme option click
            document.querySelectorAll('.theme-switcher').forEach(option => {
                option.addEventListener('click', function() {
                    const theme = this.getAttribute('data-theme');
                    // Call your existing switchTheme logic here if needed
                    if (theme === 'purple') {
                        document.getElementById('board-theme').href = '/css/board-purple.css';
                    } else if (theme === 'gold') {
                        document.getElementById('board-theme').href = '/css/board-gold.css';
                    } else if (theme === 'brown') {
                        document.getElementById('board-theme').href = '/css/board-brown.css';
                    }
                    localStorage.setItem('chess-board-theme', theme);
                    popup.style.display = 'none';
                });
            });
        });

        window.addEventListener('DOMContentLoaded', function() {
            // 1. Read language from localStorage, default to 'gr'
            const lang = localStorage.getItem('lang') || 'gr';
        
            // 2. Update all translatable areas
            updateLanguage(lang);
        });
        </script>
    </div>
</body>
</html>
