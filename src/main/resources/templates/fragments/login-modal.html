<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login Modal</title>
</head>
<body>
    <!-- Login Modal Fragment -->
    <div th:fragment="loginModal">
        <!-- Modal Container -->
        <div id="login-modal" class="modal-overlay">
            <div class="modal-container">
                <div class="modal-header">
                    <h3 class="modal-title" id="loginToChess">Log in to Chess</h3>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <!-- Google Sign In Button -->
                    <button class="social-login-btn google-btn" onclick="handleGoogleSignIn()">
                        <img src="https://www.google.com/favicon.ico" alt="Google Icon">
                        <span id="continueWithGoogle">Continue with Google</span>
                    </button>

                    <!-- Divider -->
                    <div class="divider">
                        <span class="divider-line"></span>
                        <span class="divider-text" id="or">or</span>
                        <span class="divider-line"></span>
                    </div>

                    <div id="login-form-container" style="display: flex; flex-direction: column; height: 100%;">
                        <form id="login-form" class="login-form" action="/login" method="POST">
                            <div class="form-group">
                                <label for="modal-username" id="emailOrUsername">Email or username</label>
                                <input type="text" id="modal-username" name="username" placeholder="Email or username" required autocomplete="username">
                            </div>
                            <div class="form-group">
                                <label for="modal-password" id="password">Password</label>
                                <div class="password-input">
                                    <input type="password" id="modal-password" name="password" placeholder="Password" required autocomplete="current-password">
                                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                                        <img src="/images/eye.svg" alt="Toggle password visibility">
                                    </button>
                                </div>
                            </div>
                            <div class="remember-me-row">
                                <div id="login-error-container"></div>
                            </div>
                            <button type="submit" class="login-btn" id="logIn">Log In</button>
                        </form>
                        <div class="modal-switch-msg">
                            <span id="dontHaveAccount">Don't have an account?</span>
                            <a href="#" class="modal-switch-link" onclick="switchToSignupForm()" id="signUp">Sign up</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Styles scoped to the modal -->
        <style th:inline="css">
            /* Modal styles for login popup */
            #login-modal.modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.8);
                display: none;
                justify-content: center;
                align-items: center;
                z-index: 3000;
                opacity: 0;
                visibility: hidden;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                backdrop-filter: blur(12px) saturate(180%);
            }

            #login-modal.modal-overlay.active {
                opacity: 1;
                visibility: visible;
                display: flex;
            }

            #login-modal .modal-container {
                width: 90%;
                max-width: 500px;
                max-height: 90vh; /* Increased from 82vh to better fit signup form */
                overflow: hidden;
                position: relative;
                transform: translateY(-20px) scale(0.95);
                transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
                box-shadow: 
                    0 25px 50px -12px rgba(0, 0, 0, 0.25),
                    0 0 0 1px rgba(255, 255, 255, 0.1),
                    0 0 40px rgba(0, 0, 0, 0.1);
                border: none;
                border-radius: 4px;
                background: rgba(26, 31, 38, 0.6);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px); /* Safari support */
                /* Fallback for browsers that don't support backdrop-filter */
                background: rgba(26, 31, 38, 0.9);
                box-sizing: border-box; /* Include padding and border in width calculation */
            }

            #login-modal.modal-overlay.active .modal-container {
                transform: translateY(0) scale(1);
            }

            /* Background wrapper that covers the entire modal */
            #login-modal .modal-container::before {
                content: '';
                position: absolute;
                top: 6%;
                left: 0;
                right: 0;
                bottom: 0;
                background-image: url('/images/retrochess2.jpg');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                margin: -30px;
                z-index: -1;
                border: none;
                opacity: 0.6;
                transform: scale(1.1);
            }

            /* Overlay for better text readability */
            #login-modal .modal-container::after {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(26, 31, 38, 0.5);
                z-index: -1;
            }

            #login-modal .modal-header {
                position: relative;
                display: flex;
                flex-direction: row;
                justify-content: flex-start;
                align-items: flex-start;
                padding: 0.7rem 1.25rem 0.7rem 1.25rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                background: rgba(255, 255, 255, 0.05);
                backdrop-filter: blur(4px);
                gap: 0.5rem;

            #login-modal .modal-title {
                font-size: 1.3rem;
                font-weight: 700;
                color: #fff;
                margin: 0;
                letter-spacing: -0.5px;
                background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.8) 100%);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                flex-shrink: 0;
                z-index: 1;
            }

            #login-modal .modal-close {
                position: absolute;
                top: 0.5rem;
                right: 1.25rem;
                z-index: 10;
                background: none !important;
                border: none !important;
                color: inherit !important;
                font-size: 2rem; /* Increased from 1.5rem */

            #login-modal .modal-body {

            /* Signup form specific styles for better spacing */
            #login-modal #signup-form {
                margin-bottom: 0.5rem; /* Reduced margin to match login form */
                flex: 1; /* Take available space */
            }

            #login-modal #signup-form .form-group {

            #login-modal #signup-form .form-group label {

            #login-modal #signup-form .form-group input {

                font-size: 0.9rem; /* Smaller font */

            @media (max-width: 768px) and (min-width: 481px) {

                    #login-modal .modal-close {

                }

                }

        <!-- Your existing script -->
        <script>
            // Initialize modal functionality
            document.addEventListener('DOMContentLoaded', function() {
                // Get modal elements
                const modal = document.getElementById('login-modal');
                const closeBtn = modal.querySelector('.modal-close');
                
                // Setup close button handler
                if (closeBtn) {
                    closeBtn.addEventListener('click', function() {
                        closeModal();
                    });
                }
                
                // Setup click outside handler
                modal.addEventListener('click', function(event) {
                    if (event.target === modal) {
                        closeModal();
                    }
                });

                // Setup escape key handler
                document.addEventListener('keydown', function(event) {
                    if (event.key === 'Escape' && modal.classList.contains('active')) {
                        closeModal();
                    }
                });

                // Setup login button handler
                const loginButtons = document.querySelectorAll('[onclick="openLoginModal()"]');
                loginButtons.forEach(button => {
                    button.addEventListener('click', function(e) {
                        e.preventDefault();
                        openLoginModal();
                    });
                });
                
                // Setup initial login form event listeners
                setupModalEventListeners();
            });

            /**
             * Creates the signup form HTML structure
             */
            function createSignupForm() {
                return `
                    <form id="signup-form" class="login-form" action="/signup" method="POST">
                        <div class="form-group">
                            <label for="modal-signup-username">${getTranslation('username')}</label>
                            <input type="text" id="modal-signup-username" name="username" placeholder="${getTranslation('chooseUsername')}" required>
                        </div>
                        <div class="form-group">
                            <label for="modal-signup-email">${getTranslation('email')}</label>
                            <input type="email" id="modal-signup-email" name="email" placeholder="${getTranslation('enterEmail')}" required>
                        </div>
                        <div class="form-group">
                            <label for="modal-signup-password">${getTranslation('password')}</label>
                            <div class="password-input">
                                <input type="password" id="modal-signup-password" name="password" placeholder="${getTranslation('createPassword')}" required>
                                <button type="button" class="toggle-password" onclick="toggleSignupPasswordVisibility()">
                                    <img src="/images/eye.svg" alt="Toggle password visibility">
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="modal-signup-confirm-password">${getTranslation('confirmPassword')}</label>
                            <div class="password-input">
                                <input type="password" id="modal-signup-confirm-password" name="confirmPassword" placeholder="${getTranslation('confirmYourPassword')}" required>
                                <button type="button" class="toggle-password" onclick="toggleSignupConfirmPasswordVisibility()">
                                    <img src="/images/eye.svg" alt="Toggle password visibility">
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="login-btn"> Login | Register </button>
                    </form>
                `;
            }

            /**
             * Switches the modal content to show the signup form
             */
            function switchToSignupForm() {
                const modalTitle = document.querySelector('.modal-title');
                const loginFormContainer = document.getElementById('login-form-container');
                // Update modal title
                modalTitle.textContent = getTranslation('signUpForChess');
                // Replace login form with signup form and switch message
                loginFormContainer.innerHTML = `
                    <form id="signup-form" class="login-form" action="/signup" method="POST">
                        <div class="form-group">
                            <label for="modal-signup-username">${getTranslation('username')}</label>
                            <input type="text" id="modal-signup-username" name="username" placeholder="${getTranslation('chooseUsername')}" required>
                        </div>
                        <div class="form-group">
                            <label for="modal-signup-email">${getTranslation('email')}</label>
                            <input type="email" id="modal-signup-email" name="email" placeholder="${getTranslation('enterEmail')}" required>
                        </div>
                        <div class="form-group">
                            <label for="modal-signup-password">${getTranslation('password')}</label>
                            <div class="password-input">
                                <input type="password" id="modal-signup-password" name="password" placeholder="${getTranslation('createPassword')}" required>
                                <button type="button" class="toggle-password" onclick="toggleSignupPasswordVisibility()">
                                    <img src="/images/eye.svg" alt="Toggle password visibility">
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="modal-signup-confirm-password">${getTranslation('confirmPassword')}</label>
                            <div class="password-input">
                                <input type="password" id="modal-signup-confirm-password" name="confirmPassword" placeholder="${getTranslation('confirmYourPassword')}" required>
                                <button type="button" class="toggle-password" onclick="toggleSignupConfirmPasswordVisibility()">
                                    <img src="/images/eye.svg" alt="Toggle password visibility">
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="login-btn">${getTranslation('signUpBtn')}</button>
                    </form>
                    <div class="modal-switch-msg">
                        <span>${getTranslation('alreadyHaveAccount')}</span>
                        <a href="#" class="modal-switch-link" onclick="switchToLoginForm()">${getTranslation('logInLink')}</a>
                    </div>
                `;
                // Setup signup form event listeners
                setupSignupFormEventListeners();
                
                // Ensure form is properly visible without scrolling
                setTimeout(() => {
                    const modalBody = document.querySelector('#login-modal .modal-body');
                    if (modalBody) {
                        modalBody.scrollTop = 0; // Always scroll to top
                    }
                }, 100);
            }

            /**
             * Switches the modal content back to the login form
             */
            function switchToLoginForm() {
                const modalTitle = document.querySelector('.modal-title');
                const loginFormContainer = document.getElementById('login-form-container');
                // Update modal title
                modalTitle.textContent = getTranslation('loginToChess');
                // Replace signup form with login form and switch message
                loginFormContainer.innerHTML = `
                    <form id="login-form" class="login-form" action="/login" method="POST">
                        <div class="form-group">
                            <label for="modal-username">${getTranslation('emailOrUsername')}</label>
                            <input type="text" id="modal-username" name="username" placeholder="${getTranslation('emailOrUsernamePlaceholder')}" required autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="modal-password">${getTranslation('password')}</label>
                            <div class="password-input">
                                <input type="password" id="modal-password" name="password" placeholder="${getTranslation('passwordPlaceholder')}" required autocomplete="current-password">
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                                    <img src="/images/eye.svg" alt="Toggle password visibility">
                                </button>
                            </div>
                        </div>
                        <div class="remember-me-row">
                            <div id="login-error-container"></div>
                        </div>
                        <button type="submit" class="login-btn">${getTranslation('logIn')}</button>
                        </form>
                        <div class="modal-switch-msg">
                            <span>${getTranslation('dontHaveAccount')}</span>
                            <a href="#" class="modal-switch-link" onclick="switchToSignupForm()">${getTranslation('signUp')}</a>
                        </div>
                `;
                // Setup login form event listeners
                setupModalEventListeners();
            }

            /**
             * Submits the signup form data to the server
             */
            async function submitSignupForm(username, email, password) {
                try {
                    // Send data to server
                    const response = await fetch('/api/users/signup', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ username, email, password })
                    });
                    
                    // Check the content type of the response
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        const data = await response.json();
                        if (response.ok) {
                            // First login with the credentials
                            const loginResponse = await fetch('/login', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/x-www-form-urlencoded',
                                },
                                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                            });

                            if (loginResponse.ok) {
                                // Wait a short moment to ensure session is established
                                await new Promise(resolve => setTimeout(resolve, 1000));
                                
                                // Now create the game
                                await createGameDirectly(username);
                                
                                // Close the modal and reload the page
                                closeLoginModal();
                                window.location.href = '/index?login=success';
                            } else {
                                console.error('Login failed after signup');
                                alert(getTranslation('signupSuccessful'));
                            }
                        } else {
                            // Handle JSON error response
                            const errorMessage = data.error || data.message || 'Unknown error occurred';
                            console.error('Server error:', data);
                        }
                    } else {
                        // Handle non-JSON response
                        const errorText = await response.text();
                        console.error('Server returned non-JSON response:', errorText);
                        if (response.status === 403) {
                            alert(getTranslation('accessDenied'));
                        } else if (response.status === 400) {
                            alert(getTranslation('invalidInput'));
                        } else {
                            console.error('Error during signup:', errorText);
                        }
                    }
                } catch (error) {
                    console.error('Error during signup:', error);
                }
            }

            /**
             * Sets up event listeners for the signup form
             */
            function setupSignupFormEventListeners() {
                const signupForm = document.getElementById('signup-form');
                
                signupForm.addEventListener('submit', function(event) {
                    event.preventDefault();
                    
                    // Get form data
                    const username = document.getElementById('modal-signup-username').value;
                    const email = document.getElementById('modal-signup-email').value;
                    const password = document.getElementById('modal-signup-password').value;
                    const confirmPassword = document.getElementById('modal-signup-confirm-password').value;
                    
                    // Basic validation
                    if (password !== confirmPassword) {
                        alert(getTranslation('passwordsDoNotMatch'));
                        return;
                    }

                    // Validate username length
                    if (username.length < 3 || username.length > 50) {
                        alert(getTranslation('usernameLength'));
                        return;
                    }

                    // Validate email format
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(email)) {
                        alert(getTranslation('validEmail'));
                        return;
                    }
                    
                    // Submit form data to server
                    submitSignupForm(username, email, password);
                });
            }

            /**
             * Toggles visibility of the signup password field
             */
            function toggleSignupPasswordVisibility() {
                const passwordInput = document.getElementById('modal-signup-password');
                passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
            }

            /**
             * Toggles visibility of the signup confirm password field
             */
            function toggleSignupConfirmPasswordVisibility() {
                const passwordInput = document.getElementById('modal-signup-confirm-password');
                passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
            }

            /**
             * Sets up event listeners for the modal
             */
            function setupModalEventListeners() {
                const modal = document.getElementById('login-modal');
                const closeBtn = modal.querySelector('.modal-close');
                const loginForm = document.getElementById('login-form');
                
                // Close modal when clicking the close button
                closeBtn.addEventListener('click', function() {
                    closeModal();
                });
                
                // Close modal when clicking outside the modal content
                modal.addEventListener('click', function(event) {
                    if (event.target === modal) {
                        closeModal();
                    }
                });
                
                // Clear error message when user types in username or password field
                const usernameInput = document.getElementById('modal-username');
                const passwordInput = document.getElementById('modal-password');
                
                usernameInput.addEventListener('input', clearLoginError);
                passwordInput.addEventListener('input', clearLoginError);
                
                // Handle form submission
                loginForm.addEventListener('submit', function(event) {
                    event.preventDefault();
                    
                    // Get form data
                    const username = usernameInput.value.trim();
                    const password = passwordInput.value;
                    const remember = false; // Remember me checkbox removed
                    
                    // Client-side validation
                    if (!username) {
                        showLoginError(getTranslation('pleaseEnterUsername'));
                        usernameInput.focus();
                        return;
                    }
                    
                    if (!password) {
                        showLoginError(getTranslation('pleaseEnterPassword'));
                        passwordInput.focus();
                        return;
                    }
                    
                    // Submit form data using our new handler
                    submitLoginForm(username, password, remember);
                });
            }

            /**
             * Opens the login modal
             */
            function openLoginModal() {
                const modal = document.getElementById('login-modal');
                if (modal) {
                    modal.style.display = 'flex';
                    setTimeout(() => {
                        modal.classList.add('active');
                        // Focus username input
                        const usernameInput = document.getElementById('modal-username');
                        if (usernameInput) {
                            usernameInput.focus();
                        }
                    }, 10);
                    // Prevent body scrolling
                    document.body.style.overflow = 'hidden';
                }
            }

            /**
             * Closes the login modal
             */
            function closeModal() {
                const modal = document.getElementById('login-modal');
                if (modal) {
                    modal.classList.remove('active');
                    setTimeout(() => {
                        modal.style.display = 'none';
                    }, 300); // Match transition duration
                    // Restore body scrolling
                    document.body.style.overflow = '';
                    // Clear any pending actions
                    sessionStorage.removeItem('pendingAction');
                }
            }

            // Function to show error message in the login form
            function showLoginError(message) {
                // Remove any existing error message
                const existingError = document.querySelector('.login-error');
                if (existingError) {
                    existingError.remove();
                }
                
                // Create error message element
                const errorDiv = document.createElement('div');
                errorDiv.className = 'login-error';
                errorDiv.innerHTML = `
                    <i class="fas fa-exclamation-circle"></i>
                    <span>${message}</span>
                `;
                
                // Insert error message in the error container
                const errorContainer = document.getElementById('login-error-container');
                if (errorContainer) {
                    errorContainer.appendChild(errorDiv);
                }
            }

            // Function to clear error message
            function clearLoginError() {
                const errorDiv = document.querySelector('.login-error');
                if (errorDiv) {
                    errorDiv.remove();
                }
            }

            /**
             * Submits the login form data to the server
             * @param {string} username - The username
             * @param {string} password - The password
             * @param {boolean} remember - Whether to remember the user
             */
            // Function to submit login form
            async function submitLoginForm(username, password, remember) {
                clearLoginError(); // Clear any existing error message
                
                // Show loading state
                const loginBtn = document.querySelector('.login-btn');
                const originalText = loginBtn.textContent;
                loginBtn.textContent = getTranslation('loggingIn');
                loginBtn.disabled = true;
                
                // Create form data
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                if (remember) {
                    formData.append('remember', 'on');
                }
                
                try {
                    // Submit form data to server
                    const response = await fetch('/login', {
                        method: 'POST',
                        body: formData,
                        credentials: 'same-origin' // Include cookies
                    });
                    
                    if (response.ok) {
                        // Login successful, redirect to index with success parameter
                        window.location.href = '/index?login=success';
                    } else {
                        // Try to parse error response
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) {
                            const errorData = await response.json();
                            // Use errorCode if available, otherwise fallback to message
                            const errorKey = errorData.errorCode || errorData.message;
                            showLoginError(getTranslation(errorKey) || getTranslation('invalidCredentials'));
                        } else {
                            showLoginError(getTranslation('invalidCredentials'));
                        }
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showLoginError(getTranslation('errorDuringLogin'));
                } finally {
                    // Restore button state
                    loginBtn.textContent = originalText;
                    loginBtn.disabled = false;
                }
            }

            /**
             * Creates a new game directly after login
             * @param {string} username - The username of the logged-in user
             */
            async function createGameDirectly(username) {
                try {
                    // Create the request body
                    const requestBody = {
                        username: username
                    };
                    
                    // Call the create game endpoint
                    const response = await fetch('/api/games', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        const text = await response.text();
                        throw new Error(`Failed to create game: ${response.status} ${response.statusText}. ${text}`);
                    }

                    const data = await response.json();
                    if (!data || !data.id) {
                        throw new Error('Game ID not found in response');
                    }
                    
                    // Clear the pending action
                    sessionStorage.removeItem('pendingAction');
                    
                    // Store the game ID in sessionStorage to show popup after redirect
                    sessionStorage.setItem('showGamePopup', data.id);
                    
                    // Redirect to index page instead of game page
                    window.location.href = '/index';
                } catch (error) {
                    console.error("Error creating game:", error);
                    alert(getTranslation('errorCreatingGame') + error.message);
                    
                    // Clear the pending action
                    sessionStorage.removeItem('pendingAction');
                }
            }

            /**
             * Shows the login modal when a user tries to access a protected feature
             * @param {string} action - The action the user is trying to perform
             */
            function showLoginForAction(action) {
                // Store the action in sessionStorage to handle after login
                sessionStorage.setItem('pendingAction', action);
                
                // Show the login modal with the same animation as openLoginModal
                const modal = document.getElementById('login-modal');
                if (modal) {
                    modal.style.display = 'flex';
                    setTimeout(() => {
                        modal.classList.add('active');
                        // Focus username input
                        const usernameInput = document.getElementById('modal-username');
                        if (usernameInput) {
                            usernameInput.focus();
                        }
                    }, 10);
                    // Prevent body scrolling
                    document.body.style.overflow = 'hidden';
                }
            }

            /**
             * Handles the pending action after successful login
             */
            function handlePendingAction() {
                const pendingAction = sessionStorage.getItem('pendingAction');
                
                if (pendingAction) {
                    // Clear the pending action
                    sessionStorage.removeItem('pendingAction');
                    
                    // Handle the action based on its type
                    switch (pendingAction) {
                        case 'newGame':
                            newGame();
                            break;
                        case 'joinGame':
                            showJoinGameDialog();
                            break;
                        default:
                            console.log('Unknown pending action:', pendingAction);
                    }
                }
            }

            // Add password visibility toggle function
            function togglePasswordVisibility() {
                const passwordInput = document.getElementById('modal-password');
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
            }

            // Add Google Sign In handler
            function handleGoogleSignIn() {
                // Redirect to the OAuth2 login endpoint
                window.location.href = '/oauth2/authorization/google';
            }

            // Export functions for use in other scripts
            window.openLoginModal = openLoginModal;
            window.showLoginForAction = showLoginForAction;
            window.handlePendingAction = handlePendingAction; 
        </script>
    </div>
</body>
