<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cookie Banner Fragment</title>
</head>
<body>
    <!-- Cookie Notice Banner - Will be injected via JavaScript after page load -->
    <div id="cookieBanner"></div>


    <style>
        /* Cookie Banner Styles */
        .cookie-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, rgba(42, 41, 43, 0.95), rgba(30, 29, 31, 0.95));
            border-top: 2px solid var(--primary-light);
            padding: 1.5rem;
            z-index: 10000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }

        .cookie-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .cookie-text {
            flex: 1;
            min-width: 300px;
        }

        .cookie-text h3 {
            color: var(--text-color);
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .cookie-text p {
            color: var(--text-secondary);
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .cookie-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .cookie-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            min-width: 120px;
        }

        .cookie-btn.accept {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        .cookie-btn.accept:hover {
            background: linear-gradient(135deg, #45a049, #3d8b40);
            transform: translateY(-2px);
        }

        .cookie-btn.reject {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
        }

        .cookie-btn.reject:hover {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            transform: translateY(-2px);
        }

        .cookie-btn.customize {
            background: transparent;
            color: var(--primary-light);
            border: 2px solid var(--primary-light);
        }

        .cookie-btn.customize:hover {
            background: var(--primary-light);
            color: white;
            transform: translateY(-2px);
        }


        /* Responsive Design */
        @media (max-width: 768px) {
            .cookie-content {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .cookie-actions {
                justify-content: center;
                width: 100%;
            }

            .cookie-btn {
                flex: 1;
                min-width: 100px;
            }

            .cookie-settings-modal {
                width: 95vw;
                max-height: 90vh;
            }

            .cookie-settings-body {
                max-height: 300px;
            }
        }
    </style>

    <script>
        // Cookie Notice JavaScript - Create banner dynamically after page load
        window.addEventListener('load', function() {
            // Check if user has already seen the notice
            const cookieNoticeSeen = localStorage.getItem('cookieNoticeSeen');
            
            if (!cookieNoticeSeen) {
                // Create banner dynamically after a delay
                setTimeout(() => {
                    const bannerContainer = document.getElementById('cookieBanner');
                    if (bannerContainer) {
                        // Create the banner HTML dynamically
                        bannerContainer.innerHTML = `
                            <div class="cookie-banner" style="display: block;">
                                <div class="cookie-content">
                                    <div class="cookie-text">
                                        <h3>🍪 Cookie Notice</h3>
                                        <p>We use only essential cookies for login functionality. We do not use tracking or advertising cookies.</p>
                                    </div>
                                    <div class="cookie-actions">
                                        <button id="acceptCookies" class="cookie-btn accept">Got it</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        
                        // Add event listener to the dynamically created button
                        const acceptBtn = document.getElementById('acceptCookies');
                        if (acceptBtn) {
                            acceptBtn.addEventListener('click', function() {
                                localStorage.setItem('cookieNoticeSeen', 'true');
                                const banner = document.querySelector('.cookie-banner');
                                if (banner) {
                                    banner.style.display = 'none';
                                }
                            });
                        }
                    }
                }, 10000); // 10 second delay to ensure crawlers don't see it
            }
        });
    </script>
</body>
</html>
