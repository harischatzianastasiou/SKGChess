<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Audio Player Fragment</title>
    <style>
        /* Style for the music player button */
        .music-player {
            position: fixed;      /* Fixed position */
            bottom: 20px;        /* 20px from bottom */
            right: 20px;         /* 20px from right */
            z-index: 1000;       /* Ensure it's above other elements */
            width: 45px;         /* Reduced width from 60px */
            height: 22px;        /* Reduced height from 30px */
            background: #ff4444; /* Red background when muted */
            border-radius: 11px; /* Adjusted border radius for smaller size */
            cursor: pointer;     /* Show pointer cursor */
            transition: all 0.3s ease;  /* Smooth transitions */
            display: flex;       /* Flex container */
            align-items: center; /* Center vertically */
            border: none;        /* Remove border */
            padding: 0;          /* Remove padding */
        }

        .music-player::before {
            content: '';         /* Empty content */
            position: absolute;  /* Position absolutely */
            left: 2px;          /* Adjusted from 3px */
            width: 18px;        /* Reduced from 24px */
            height: 18px;       /* Reduced from 24px */
            background: white;   /* White circle */
            border-radius: 50%;  /* Make it circular */
            transition: all 0.3s ease;  /* Smooth transitions */
        }

        .music-player.unmuted {
            background: #4CAF50; /* Green background when unmuted */
        }

        .music-player.unmuted::before {
            left: calc(100% - 20px); /* Adjusted from 27px */
        }

        /* Remove old icon styles */
        .music-player i {
            display: none;      /* Hide the icon */
        }

        .music-credits {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: rgba(26, 22, 37, 0.95);  /* Dark purple background */
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 0.85em;
            max-width: 300px;
            display: none;
            z-index: 1000;
            border-left: 4px solid #fafafa;  /* Purple accent border */
            box-shadow: 0 2px 10px rgba(107, 70, 193, 0.3);  /* Purple shadow */
            cursor: default;  /* Changed from pointer to default */
            transition: all 0.3s ease;  /* Smooth transition for hover effect */
        }

        .music-credits:hover {
            transform: none;  /* Remove hover effect */
        }

        .music-credits.show {
            display: block;
        }

        .music-credits .close-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: none;
            border: none;
            color: #9f7aea;  /* Light purple close button */
            cursor: pointer;
            font-size: 1.2em;
            padding: 0;
        }

        .music-credits .close-btn:hover {
            color: #ffffff;  /* Darker purple on hover */
        }

        .music-credits .title {
            font-weight: bold;
            color: #ffffff;  /* Light purple title */
            font-size: 1.1em;
        }

        .music-credits .license {
            font-size: 0.9em;
            color: #fefeff;  /* Light purple license text */
            margin-top: 8px;
            border-top: 1px solid rgba(107, 70, 193, 0.3);  /* Purple separator */
            padding-top: 8px;
        }

        /* Add tooltip styles */
        .music-player::after {
            content: 'Toggle music';  /* Tooltip text */
            position: absolute;       /* Position absolutely */
            bottom: 100%;            /* Position above the toggle */
            left: 50%;               /* Center horizontally */
            transform: translateX(-50%);  /* Center the tooltip */
            padding: 5px 10px;       /* Add padding */
            background: rgba(0, 0, 0, 0.8);  /* Dark background */
            color: white;            /* White text */
            font-size: 12px;         /* Small font size */
            border-radius: 4px;      /* Rounded corners */
            white-space: nowrap;     /* Keep text in one line */
            opacity: 0;              /* Start invisible */
            visibility: hidden;      /* Hide by default */
            transition: all 0.3s ease;  /* Smooth transition */
            pointer-events: none;    /* Prevent tooltip from interfering with clicks */
        }

        .music-player:hover::after {
            opacity: 1;              /* Show on hover */
            visibility: visible;     /* Make visible on hover */
            bottom: calc(100% + 5px);  /* Add some space between toggle and tooltip */
        }
    </style>
</head>
<body>
    <!-- Define the fragment with a name -->
    <div th:fragment="audio-player">
        <!-- Audio element for background music -->
        <audio id="backgroundMusic" preload="auto" muted>
            <!-- Audio sources will be added dynamically -->
        </audio>

        <!-- Update the music player button -->
        <button class="music-player" onclick="initializeAndToggleMusic()"></button>

        <!-- Music Credits -->
        <div class="music-credits" id="musicCredits">
            <button class="close-btn" onclick="event.stopPropagation(); this.parentElement.classList.remove('show')">&times;</button>
            <p><span class="title" id="currentSongTitle">Loading...</span></p>
            <p id="currentSongArtist"></p>
            <p>Source: Free Music Archive / Incompetech</p>
            <p id="currentSongLicense"></p>
        </div>

        <!-- JavaScript for audio control -->
        <script>
            // Define the playlist
            const playlist = [
                {
                    title: "STAY IN THE GREAT",
                    artist: "BOCREW",
                    src: "/audio/STAY IN THE GREAT - BOCREW (OFFICIAL AUDIO).mp3",
                    license: "CC BY 3.0"
                },
                {
                    title: "SUNBIRDS",
                    artist: "BOCREW THEDEEPR",
                    src: "/audio/SUNBIRDS BY BOCREW THEDEEPR (OFFICIAL AUDIO).mp3",
                    license: "CC BY 3.0"
                }
            ];

            let currentSongIndex = -1; // Will be set when first song is played

            // Function to get a random song index different from current
            function getRandomSongIndex() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * playlist.length);
                } while (newIndex === currentSongIndex && playlist.length > 1);
                return newIndex;
            }

            // Function to play next random song
            function playNextRandomSong() {
                currentSongIndex = getRandomSongIndex();
                const song = playlist[currentSongIndex];
                const audio = document.getElementById('backgroundMusic');
                
                // Update audio source
                audio.src = song.src;
                
                // Update credits
                document.getElementById('currentSongTitle').textContent = song.title;
                document.getElementById('currentSongArtist').textContent = `by ${song.artist}`;
                document.getElementById('currentSongLicense').textContent = `License: ${song.license}`;
                
                // Play the song
                audio.play().catch(error => {
                    console.error("Playback failed:", error);
                });
            }

            // Make the function globally available
            window.initializeAndToggleMusic = function() {
                const audio = document.getElementById('backgroundMusic');
                const musicPlayer = document.querySelector('.music-player');
                const credits = document.getElementById('musicCredits');
                
                // Toggle play/pause
                if (audio.paused) {
                    console.log('Unmuting audio');
                    // First unmute, then play
                    audio.muted = false;
                    localStorage.setItem('musicMuted', 'false');  // Store mute state
                    if (currentSongIndex === -1) {
                        // First time playing, start with a random song
                        playNextRandomSong();
                    } else {
                        audio.play().catch(error => {
                            console.error("Playback failed:", error);
                        });
                    }
                    musicPlayer.classList.add('unmuted');
                    credits.classList.add('show');  // Show credits when unmuted
                } else {
                    console.log('Muting audio');
                    audio.pause();
                    audio.muted = true;  // Ensure it's muted when paused
                    localStorage.setItem('musicMuted', 'true');  // Store mute state
                    musicPlayer.classList.remove('unmuted');
                    credits.classList.remove('show');  // Hide credits when muted
                }
            };

            // Initialize audio on page load
            document.addEventListener('DOMContentLoaded', function() {
                const audio = document.getElementById('backgroundMusic');
                const musicPlayer = document.querySelector('.music-player');
                const credits = document.getElementById('musicCredits');

                // Get stored mute state
                const isMuted = localStorage.getItem('musicMuted') === 'true';
                
                // Set initial state based on stored preference
                audio.volume = 0.5;  // Set to half volume
                audio.muted = isMuted;  // Use stored mute state
                
                if (isMuted) {
                    musicPlayer.classList.remove('unmuted');
                    credits.classList.remove('show');
                } else {
                    musicPlayer.classList.add('unmuted');
                    credits.classList.add('show');
                    // Start playing immediately only if not muted
                    playNextRandomSong();
                }

                // Add event listener for when a song ends
                audio.addEventListener('ended', () => {
                    playNextRandomSong();
                });

                // Add event listeners for audio loading and errors
                audio.addEventListener('loadeddata', () => {
                    console.log('Audio file loaded successfully');
                    console.log('Audio duration:', audio.duration, 'seconds');
                    console.log('Audio source:', audio.currentSrc);
                });

                audio.addEventListener('error', (e) => {
                    console.error('Error loading audio:', e);
                    console.error('Audio error details:', audio.error);
                    console.error('Audio source:', audio.currentSrc);
                    
                    // Try to load the next song if there's an error
                    playNextRandomSong();
                });

                // Log initial audio state
                console.log('Initial audio state:', {
                    hasAudio: !!audio,
                    readyState: audio.readyState,
                    muted: audio.muted,
                    paused: audio.paused,
                    src: audio.currentSrc
                });
            });
        </script>
    </div>
</body>
</html>
